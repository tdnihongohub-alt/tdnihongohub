name: Deploy website to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      VITE_HOSTING_TARGET: github
      VITE_FIREBASE_API_KEY: AIzaSyBaa-4Hlt-xxLWo7_7Pu-aV_GSI9vmqD-U
      VITE_FIREBASE_AUTH_DOMAIN: td-nihongo-hub.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: td-nihongo-hub
      VITE_FIREBASE_APP_ID: 1:705873751960:web:83f6427a4d87c33f6005ed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
